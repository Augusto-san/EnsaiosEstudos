<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>memoFULL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2a2a2a">
  <meta name="robots" content="noindex, nofollow">
  <base target="_top">

  <!--
  Estilos do CodeMirror
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/monokai.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/dracula.min.css">

  Scripts do CodeMirror
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/edit/closetag.min.js"></script>
  -->
  
  <style>
    /* Reset básico */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: #3a3a3a;
      color: #FFF;
      font-size: clamp(1rem, 2.5vw, 2rem);
      line-height: 1.5;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #2a2a2a;
      padding: 2px/*15px*/;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      z-index: 1000;
      position: fixed;
      width: 100%;
    }

    .header h2 {
      margin: 0;
      flex: 1;
      text-align: center;
    }

    .menu-toggle {
      font-size: 24px;
      background: none;
      border: none;
      color: #FFF;
      cursor: pointer;
      padding: 10px;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 0px 0px 0px;
    }

    a {
      color: #6495ed;
    }
    
    .flashcard {
      border: 1px solid #81ce39;
      padding: 15px;
      margin: 10px 0px;
      text-align: center; /*justify;*/
      background-color: #4a4a4a;
      border-radius: 8px;
      width: 90%;
      /*max-width: 95%;*/
      font-size: clamp(1.1rem, 2vw, 1.3rem);
    }

    /*#front-content, #back-content, #cabecalho-frente, #cabecalho-verso*/

    #add-card-modal { 
      display: none; 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      overflow-y: auto;
      background: #3a3a3a; /*rgba(0, 0, 0, 0.8);*/ 
      color: white; 
      z-index: 9999;
    }

    #disciplina-form-add-card, #materia-form-add-card{
      border-radius: 7px;
    }

    #add-card-modal-in{
      max-width: 500px; 
      /*margin: 50px auto;*/ 
      padding: 20px; 
      background: #2a2a2a; /*black;*/ 
      border-radius: 5px;
    }


    #add-card-modal-in > h2 {
      text-align: center;
    }

    #frente-form-textarea, #verso-form-textarea {
     height: 150px;
     min-height: 150px;
     box-sizing: border-box;
     overflow-y: hidden;
     resize: none;
     border-radius: 7px; 
    }

    .label-add-card-form, #add-card-modal-in > h2 {
      color: #81ce39;
    }

    #front-content, #back-content {
      margin-top: 10px;
      text-align: justify;
      white-space: pre-wrap;
    }

    .front, .back {
      border: none;
      color: #FFF;
    }

    hr {
      width: 100%;
      border: none;
      height: 1px;
      background-color: #81ce39;
      margin: 20px 0;
    }

    .flashcard .back {
      display: none;
      /*margin-top: 20px;*/
    }


    /* TEXTAREA EDITAR FRENTE e TEXTAREA EDITAR VERSO */
    #back-edit, #front-edit{
      width: 100%;
      height: 400px;
      color: #000000;
      background-color: #ffffff;
      font-family: Arial, sans-serif;
      overflow-y: scroll;
      max-width: 100%;
      min-width: 100%;
      line-height: 1.5;
      font-size: clamp(1rem, 2.5vw, 2rem);
      border-radius: 5px;
      padding: 15px;
      text-align: justify;
    }


    .footer {
      background-color: #2a2a2a;
      padding: 15px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: sticky;
      bottom: 0;
      width: 100%;
    }

    .buttons-container {
      display: flex;
      flex-direction: row; /*column;*/
      width: 100%;
      max-width: 95%;
      margin-bottom: 10px;
    }

    .buttons-container-header {
      display: flex;
      flex-direction: row; /*column;*/
      flex-wrap: nowrap;
      justify-content: flex-start;
      align-items: center;
      gap: 0;
      width: 100%;
      max-width: 95%;
      margin: 0 auto;
      /*margin-bottom: 10px;*/
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory;
      padding-bottom: 10px; /*Para evitar que a barra de rolagem sobreponha os botões*/
    }

    .buttons-container-header::-webkit-scrollbar {
      height: 8px; /* Altura da barra de rolagem */
    }

    .buttons-container-header::-webkit-scrollbar-thumb {
      background: #81ce39; /* Cor da barra de rolagem */
      border-radius: 4px;
    }

    .buttons-container-header::-webkit-scrollbar-track {
      background: #555555; /* Cor do fundo da barra de rolagem */
    }


    #excluir-button, #edit-button {
      font-size: 25px;
    }


    #cancel-button, #counter-button, #br-copy-button, 
    #ppp-copy-button, #link-copy-button, #data-button, #excluir-button, #bold-button, #italic-button, #underline-button, #mark-button, #borda-button {
      display: none;
    }

    #edit-button, #cancel-button, #add-button, 
    #counter-button, #br-copy-button, #ppp-copy-button,
    #link-copy-button {
      font-size: 20px;
    }
    
    .buttons-container button {
      flex: 1; /* equivale a flex: 1 1 0; o item pode crescer, encolher e tem um tamanho inicial de 0

      flex: 0 1 auto; o item pode encolher, mas não cresce. Seu tamanho inicial é automático com base no conteúdo  */
      margin: 2% 2%;
      padding: 15px;
      font-size: 16px;
      line-height: 24px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background-color: #555555; /*#81ce39;*/
      color: #FFF;
      transition: background-color 0.3s;
    }

    /* ESTRUTURA FLEX:

      FLEX-GROW: controla a capacidade do item de crescer para ocupar espaço adicional

      FLEX-SHRINK: controla a capacidade do item de encolher quando há pouco espaço disponível

      FLEX-BASIS: define o tamanho inicial do item antes de aplicar o crescimento ou encolhimento

     */

    .buttons-container-header button {
      flex: 0 0 46%;
      min-width: 48px;
      /*0 0 20%;  
      FLEX-GROW: 0; o item não crescerá mesmo que haja espaço extra no container 

      FLEX-SHRINK: 0; o item não encolherá mesmo que o container não tenha espaço suficiente

      FLEX-BASIS: 25%; define o tamanho inicial do item como 25% proporcional ao container
      */
      margin: 2% 2%;
      padding: 15px;
      font-size: 16px;
      line-height: 24px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background-color: #555555; /*#81ce39;*/
      color: #FFF;
      transition: background-color 0.3s;
      scroll-snap-align: start;
    }

    .buttons-container button.active, .buttons-container-header button.active {
      background-color:#477d14;
      color: #FFF;
    }

    #favorite-button {
      display: none;
      font-size: 25px;
    }

    #favorite-button.active {
      color: #FFD700;
    }

    #app-notification {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 60px);
      left: 50%;
      z-index: 10001;
      max-width: calc(100vw - 32px);
      padding: 10px 16px;
      border: 1px solid #ffe033;
      border-radius: 8px;
      background-color: #e6c300;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.35);
      color: #424242;
      font-size: 16px;
      line-height: 1.4;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, -8px);
      transition: opacity 180ms ease, transform 180ms ease, visibility 180ms;
      pointer-events: none;
    }

    #app-notification.visible {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
    }

    @media (prefers-reduced-motion: reduce) {
      #app-notification {
        transition: none;
      }
    }
    
    .buttons-container button:hover, .buttons-container-header button:hover {
      background-color: #413f3f; /*#6da32e;*/
      border: 2px dotted #81ce39;
    }

    .add-card-formulario {
      width: 100%;
      max-width: 100%;
      min-width: 100%;
      margin-bottom: 10px;
    }

    input.add-card-formulario,
    select.add-card-formulario {
      height: 54px;
      min-height: 54px;
      box-sizing: border-box;
      padding: 0 12px;
      font-size: 16px;
    }

    .navigation-buttons {
      display: flex;
      flex-direction: row;
      width:  100%;
      max-width: 95%;
    }

    .navigation-buttons button {
      flex: 1;
      margin: 2% 2%; /*0 5px;*/
      padding: 10px;
      font-size: 21px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background-color: #555;
      color: #FFF;
    }

    .navigation-buttons button:hover {
      background-color: #413f3f; /*#444;*/
      border: 2px dotted #81ce39;
    }

    .side-menu {
      position: fixed;
      top: 0;
      left: -300px;
      width: 300px;
      height: 100%;
      background-color: #2a2a2a;
      color: #FFF;
      box-shadow: 2px 0 5px rgba(0, 0, 0, 0.5);
      padding: 20px;
      transition: left 0.3s ease;
      z-index: 1000;
    }

    .side-menu.open {
      left: 0;
    }

    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .menu-header h3 {
      margin: 0;
      color: #81ce39;
    }

    #close-menu {
      font-size: 20px;
      background: none;
      border: none;
      color: #ff0202;
      cursor: pointer;
    }

    .filters {
      margin-top: 16px;
    }

    .filters label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #81ce39;
    }

    .filters select {
      width: 100%;
      margin-bottom: 8px;
      padding: 8px;
      font-size: 14px;
      border-radius: 5px;
      border: 1px solid #ccc;
      background-color: #fff;
      color: #0063cb; /*000;*/
    }

    .field-divider {
      width: 100%;
      height: 1px;
      margin: 0 0 14px;
      background-color: #81ce39;
    }

    #apply-filters, #clear-filters {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      background-color: #3f7f04; /*81ce39;*/
      color: #FFF;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-bottom: 10px;
    }

    #apply-filters:hover, #clear-filters:hover,
    #apply-filters:focus, #clear-filters:focus,
    #apply-filters:active, #clear-filters:active {
      background-color: #3f7f04;
    }


  </style>
</head>

<body>
  <div class="header">
    <h2>&copy; memoFULL 🧠</h2>

    <!-- FORM PARA ADICIONAR NOVO CARTÃO -->

    <div id="add-card-modal">
      <div id="add-card-modal-in">
        <h2>ADICIONAR NOVO CARTÃO</h2>

          <label class="label-add-card-form" for="disciplina-form-add-card">Disciplina</label>
          <select id="disciplina-form-add-card" name="disciplina-form-add-card" required class="add-card-formulario">
            <option value="">Selecione uma disciplina</option>

          <select id="materia-form-add-card" name="materia-form-add-card" required class="add-card-formulario" disabled>
            <option value="">Selecione uma disciplina primeiro</option>

            <textarea id="frente-form-textarea" name="frente-form-textarea" required class="add-card-formulario"></textarea>

      <button id="anterior-btn">ᐊ</button>
      <button id="proximo-btn">ᐅ</button>

<script>
const APPS_SCRIPT_API_URL = "https://script.google.com/macros/s/AKfycbxup-Cbvc0nk0ns5plhHjqy0FwKARLOO3qhmIyDpsi_Atl-1qrofpRLIwv2GVjLw4BGkQ/exec";

document.addEventListener("DOMContentLoaded", async function () {
  let originalData = [];
  let data = [];
  let currentCardIndex = 0;
  const favoriteButton = document.getElementById("favorite-button");
  const appNotification = document.createElement("div");
  appNotification.id = "app-notification";
  appNotification.setAttribute("role", "status");
  appNotification.setAttribute("aria-live", "polite");
  appNotification.setAttribute("aria-atomic", "true");
  document.body.appendChild(appNotification);
  let appNotificationTimer = null;
  let addCardOptions = { disciplinas: [], materias: [] };

  function showAppNotification(message) {
    window.clearTimeout(appNotificationTimer);
    appNotification.classList.remove("visible");
    appNotification.textContent = "";

    requestAnimationFrame(() => {
      appNotification.textContent = message;
      appNotification.classList.add("visible");
      appNotificationTimer = window.setTimeout(() => {
        appNotification.classList.remove("visible");
      }, 2600);
    });
  }

  async function callAppsScript(method, parameters = {}) {
    if (!APPS_SCRIPT_API_URL.startsWith("https://script.google.com/macros/s/") ||
        !APPS_SCRIPT_API_URL.endsWith("/exec")) {
      throw new Error("Configure a URL /exec da implantação da API no início do script.");
    }

    let requestUrl = APPS_SCRIPT_API_URL;
    let requestOptions;
    if (method === "getCards" || method === "getAddCardOptions") {
      if (method === "getAddCardOptions") requestUrl += "?action=options";
      requestOptions = {
        method: "GET",
        cache: "no-store",
        redirect: "follow"
      };
    } else if (method === "addCard" || method === "saveCard") {
      const payload = {
        ...parameters,
        action: method === "addCard" ? "add" : "update"
      };
      const body = new URLSearchParams();
      Object.entries(payload).forEach(([key, value]) => {
        body.append(key, value == null ? "" : String(value));
      });
      requestOptions = {
        method: "POST",
        body,
        redirect: "follow"
      };
    } else {
      throw new Error("Função da API desconhecida.");
    }

    const response = await fetch(requestUrl, requestOptions);
    const responseText = await response.text();
    let result;

    try {
      result = JSON.parse(responseText);
    } catch (error) {
      throw new Error("A API não retornou JSON. Confira a URL e a implantação do Apps Script.");
    }

    if (!response.ok) {
      throw new Error((result && result.error) || `Falha na API (${response.status}).`);
    }
    if (result && result.success === false) {
      throw new Error(result.error || "A API informou que a operação falhou.");
    }

    return result;
  }

  async function sendApiMutation(parameters) {
    const method = parameters.action === "add" ? "addCard" : "saveCard";
    const result = await callAppsScript(method, parameters);
    if (!result || result.success !== true) {
      throw new Error((result && result.error) || "O Apps Script não confirmou a gravação.");
    }

    return result;
  }

  function cardMutationReference(card) {
    if (!card || card.id == null || String(card.id).trim() === "") {
      throw new Error("O cartão não possui ID_CARTAO e não pode ser atualizado.");
    }
    return { id: card.id };
  }

  // AUXILIAR NO CONTADOR DE CARTÕES
  let remainingCards = 0; // * Variável global para rastrear o número de cartões restantes
  let isSavingFavorite = false;

// Função para buscar os dados e carregar apenas os filtros
  async function fetchFilters() {
    const cards = await callAppsScript("getCards");
    if (!Array.isArray(cards)) {
      throw new Error("O Apps Script não retornou uma lista de cartões.");
    }
    if (cards.some(card =>
      !card || typeof card !== "object" ||
      !Object.prototype.hasOwnProperty.call(card, "resultado")
    )) {
      throw new Error("A API não retornou o campo 'resultado'. Confira se index.html e Apps Script estão na mesma versão.");
    }
    originalData = cards.map(card => ({ ...card, resultado: card.resultado ?? "" }));
    populateFilters();
  }

  async function fetchAddCardOptions() {
    const options = await callAppsScript("getAddCardOptions");
    if (!options || !Array.isArray(options.disciplinas) || !Array.isArray(options.materias)) {
      if (Array.isArray(options)) {
        throw new Error("O /exec ainda está devolvendo os cartões. Publique no Apps Script a versão com action=options.");
      }
      const keys = options && typeof options === "object" ? Object.keys(options).join(", ") : typeof options;
      throw new Error(`Resposta de opções inválida da API (${keys}).`);
    }
    addCardOptions = options;
    populateAddCardDisciplineOptions();
  }

  function populateAddCardDisciplineOptions() {
    const disciplineSelect = document.getElementById("disciplina-form-add-card");
    disciplineSelect.replaceChildren();

    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "Selecione uma disciplina";
    disciplineSelect.appendChild(placeholder);

    sortedUniqueFilterValues(addCardOptions.disciplinas).forEach(discipline => {
      const option = document.createElement("option");
      option.value = discipline;
      option.textContent = discipline;
      disciplineSelect.appendChild(option);
    });

    updateAddCardMatterOptions();
  }

  function updateAddCardMatterOptions() {
    const disciplineSelect = document.getElementById("disciplina-form-add-card");
    const matterSelect = document.getElementById("materia-form-add-card");
    const selectedDiscipline = disciplineSelect.value;
    const availableMatters = selectedDiscipline
      ? addCardOptions.materias.filter(item => item.disciplina === selectedDiscipline)
      : [];

    matterSelect.replaceChildren();
    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = selectedDiscipline
      ? "Selecione uma matéria"

  function populateFilters() {
    updateDisciplineFilter();

    updateResultFilter();
    updateDataFilter(); //02-03-2025
  }

  const filterCollator = new Intl.Collator("pt-BR", {
    numeric: true,
    sensitivity: "base"
  });

  function sortedUniqueFilterValues(values) {
    return Array.from(new Set(values)).sort((a, b) =>
      filterCollator.compare(String(a ?? ""), String(b ?? ""))
    );
  }

  function parseFilterDate(value) {
    if (!value) return null;
    if (value instanceof Date) {
      return Number.isNaN(value.getTime()) ? null : value;
    }

    const text = String(value).trim();
    if (!text || text === "-") return null;

    const isoDate = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (isoDate) {
      return new Date(Number(isoDate[1]), Number(isoDate[2]) - 1, Number(isoDate[3]));
    }

    const brazilianDate = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (brazilianDate) {
      return new Date(Number(brazilianDate[3]), Number(brazilianDate[2]) - 1, Number(brazilianDate[1]));
    }

    const parsed = new Date(text);
    return Number.isNaN(parsed.getTime()) ? null : parsed;
  }

  function formatFilterDate(value) {
    const date = parseFilterDate(value);
    return date ? date.toLocaleDateString("pt-BR") : "";
  }

  function compareFilterDateLabels(first, second) {
    const [firstDay, firstMonth, firstYear] = first.split("/").map(Number);
    const [secondDay, secondMonth, secondYear] = second.split("/").map(Number);
    return firstYear - secondYear || firstMonth - secondMonth || firstDay - secondDay;
  }

// ATUALIZA O FILTRO DE DATA BASEADO NA DISCIPLINA, CONTEÚDO E RESULTADO
function updateDataFilter(selectedDiscipline = "todos", selectedContent = "todos", selectedResult = "todos") {
  const dataFilter = document.getElementById("data-filter");

  let filteredData = originalData;

  if (selectedDiscipline !== "todos") {
    filteredData = filteredData.filter(item => item.disciplina === selectedDiscipline);
  }
  if (selectedContent !== "todos") {
    filteredData = filteredData.filter(item => item.conteudo === selectedContent);
  }
  if (selectedResult !== "todos") {
    filteredData = filteredData.filter(item => item.resultado === selectedResult);
  }

  // Convertendo todas as datas para o formato "DD/MM/AAAA"
  const datas = Array.from(new Set(filteredData.map(item => {
    return formatFilterDate(item.data_revisao) || null;
  }))).filter(Boolean) // Remove valores nulos ou inválidos
  .sort(compareFilterDateLabels);

  // Atualiza as opções do filtro de data
  dataFilter.innerHTML = `<option value="todos">Todos</option>`;
  datas.forEach(d => {
    dataFilter.innerHTML += `<option value="${d}">${d}</option>`;
  });
}

    (resultado === "todos" || item.resultado === resultado) &&
    (dataRevisao === "todos" || (item.data_revisao && formatFilterDate(item.data_revisao) === dataRevisao)) &&
    (favoritos === "todos" || isFavoriteValue(item.favorito))
  );

  currentCardIndex = 0;

  remainingCards = data.length;

  updateCardCounter();

  if (data.length > 0) {
    favoriteButton.style.display = "inline-block";

      document.getElementById(elementId).replaceChildren();
    });

  dataButton.style.display = "inline-block";
  excluirButton.style.display = "inline-block";
}

  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]]; // Troca de elementos
    }
    return array;
  }

        }

        const editor = lastFocusedTextarea;
        const { selectionStart, selectionEnd, value } = editor;
        const selectedText = value.slice(selectionStart, selectionEnd);

        applyTextAction('itálico', `<span style="color: #FF8C00;"><em>${selectedText}</em></span>`);


      });



      // BOTÃO SUBLINHADO
      document.getElementById("underline-button").addEventListener("click", () => {
        
        if (!lastFocusedTextarea) {
          showAppNotification("Selecione um campo antes de aplicar o sublinhado.");
          return; // Impede que o código continue se lastFocusedTextarea for null
        }

        const editor = lastFocusedTextarea;
        const { selectionStart, selectionEnd, value } = editor;
        const selectedText = value.slice(selectionStart, selectionEnd);

        applyTextAction('sublinhado', `<span style="text-decoration: underline; text-decoration-color: red;">${selectedText}</span>`);


      });



      // BOTÃO MARCADOR + SPAN
      document.getElementById("mark-button").addEventListener("click", () => {
        
        if (!lastFocusedTextarea) {
          showAppNotification("Selecione um campo antes de aplicar o marcador.");
          return; // Impede que o código continue se lastFocusedTextarea for null
        }

        const editor = lastFocusedTextarea;
        const { selectionStart, selectionEnd, value } = editor;
        const selectedText = value.slice(selectionStart, selectionEnd);

        applyTextAction('marcador', `<mark style="background-color: #FFD700; padding: 2px 4px; border-radius: 4px;"><span style="color: #000000;">${selectedText}</span></mark>`);


      });



      // BOTÃO BORDA
      document.getElementById("borda-button").addEventListener("click", () => {
        
        if (!lastFocusedTextarea) {
          showAppNotification("Selecione um campo antes de aplicar o marcador.");
          return; // Impede que o código continue se lastFocusedTextarea for null
        }

        const editor = lastFocusedTextarea;
        const { selectionStart, selectionEnd, value } = editor;
        const selectedText = value.slice(selectionStart, selectionEnd);

        applyTextAction('borda', `<span style="border: 2px solid #FF8C00; padding: 2px; color: #000000;">${selectedText}</span>`);

      });

      // FIM DA FUNÇÃO DOS BOTÕES EM EDITAR






  } else {


    // Confirmação para salvar alterações
    const confirmSave = confirm("Tem certeza que deseja fazer essa modificação?");
    if (!confirmSave) return;


    // Salvar alterações
    const newFrontText = document.getElementById("front-edit").value;
    const newBackText = document.getElementById("back-edit").value;
    const currentCard = data[currentCardIndex];

    try {
      isSavingEdit = true;
      editButton.disabled = true;
      cancelButton.disabled = true;
      await sendApiMutation({
        ...cardMutationReference(currentCard),
        frente: newFrontText,
        tras: newBackText
      });
    } catch (error) {
      console.error("Error saving card:", error);
      const detail = error instanceof Error ? error.message : String(error);
      showAppNotification(`Não foi possível salvar as alterações. O cartão continua em modo de edição. ${detail}`);
      return;
    } finally {
      isSavingEdit = false;
      editButton.disabled = false;
      cancelButton.disabled = false;
    }

    currentCard.frente = newFrontText;
    currentCard.tras = newBackText;

    // Itera por todos os botões dentro do container e altera o valor do flex
    buttonsDivContainerHeader.forEach(button => {
        button.style.flex = "0 0 46%";
    });

    // Atualizar conteúdos
    frontContent.innerHTML = newFrontText;
    backContent.innerHTML = newBackText;

    // Alterar texto do botão
    editButton.textContent = "✎";

    // Ocultar botões
    cancelButton.style.display = "none"; // botão "cancelar" na ação de edição
    brCopyButton.style.display = "none"; // botão copiar <br>
      boldButton.style.display = "none"; // botão bold <b>
      italicButton.style.display = "none"; // botão itáliico <i>
      underlineButton.style.display = "none"; // botão sublinhado
      markButton.style.display = "none"; // botão marcador
      bordaButton.style.display = "none"; // botão inserir borda
    pppCopyButton.style.display = "none"; // botão copiar ...
    linkCopyButton.style.display = "none"; // botão copiar link



    // Mostrar botões e footer
    addButton.style.display = "inline-block"; // botão adicionar cartão
    counterButton.style.display = "inline-block"; // contador
    divFooter.style.display = "flex"; // footer
    resultButtons.style.display = "flex"; // botões de classificação de resultado

    // Opcional: enviar os dados atualizados para a API ou backend, se necessário
    showAppNotification("Alterações salvas com sucesso!");

}


  isEditing = !isEditing;
}


// FUNÇÃO SOBRE O BOTÃO CANCELAR

function cancelEditMode() {
  if (isSavingEdit) return;

  const frontContent = document.getElementById("front-content");
  const backContent = document.getElementById("back-content");
  const editButton = document.getElementById("edit-button");
  const cancelButton = document.getElementById("cancel-button");
  const addButton = document.getElementById("add-button");
  const counterButton = document.getElementById("counter-button");
  const brCopyButton = document.getElementById("br-copy-button");
    const boldButton = document.getElementById("bold-button");
    const italicButton = document.getElementById("italic-button");
    const underlineButton = document.getElementById("underline-button");
    const markButton = document.getElementById("mark-button");
    const bordaButton = document.getElementById("borda-button");
  const pppCopyButton = document.getElementById("ppp-copy-button");
  const linkCopyButton = document.getElementById("link-copy-button");
  const buttonsDivContainerHeader = document.querySelectorAll(".buttons-container-header button");
  const divFooter = document.querySelector(".footer");
  const resultButtons = document.getElementById("result-buttons");

  // Confirmação para cancelar alterações
  const confirmCancel = confirm("Tem certeza que deseja cancelar a modificação?");
  if (!confirmCancel) return;
  
    // Itera por todos os botões dentro do container e altera o valor do flex
    buttonsDivContainerHeader.forEach(button => {
        button.style.flex = "0 0 46%";
    });

  // Restaurar os textos originais
  frontContent.innerHTML = originalFrontText;
  backContent.innerHTML = originalBackText;

  // Alterar texto do botão e esconder botão "Voltar"
  editButton.textContent = "✎";

  // Ocultar botões
  cancelButton.style.display = "none";
  brCopyButton.style.display = "none"; // botão copiar <br>
      boldButton.style.display = "none"; // botão bold <b>
      italicButton.style.display = "none"; // botão itáliico <i>
      underlineButton.style.display = "none"; // botão sublinhado
      markButton.style.display = "none"; // botão marcador
      bordaButton.style.display = "none"; // botão inserir borda
  pppCopyButton.style.display = "none"; // botão copiar ...
  linkCopyButton.style.display = "none"; // botão copiar link


  // Exibir botões e footer
  addButton.style.display = "inline-block"; // botão adicionar cartão
  counterButton.style.display = "inline-block"; // contador
  divFooter.style.display = "flex"; // footer
  resultButtons.style.display = "flex"; // botões de classificação de resultado

  isEditing = false;
}


// FUNÇÃO PARA ADICIONAR NOVO CARTÃO

  const addButton = document.getElementById("add-button");
  const addCardModal = document.getElementById("add-card-modal");
  const addCardForm = document.getElementById("add-card-form");
  const cancelAddCard = document.getElementById("cancel-add-card");
  const saveAddCardButton = document.getElementById("save-add-card");
  const disciplineSelect = document.getElementById("disciplina-form-add-card");
  const matterSelect = document.getElementById("materia-form-add-card");
  const addCardTextareas = [
    document.getElementById("frente-form-textarea"),
    document.getElementById("verso-form-textarea")
  ];

  function resizeAddCardTextarea(textarea) {
    textarea.style.height = "auto";
    const styles = getComputedStyle(textarea);
    const minHeight = parseFloat(styles.minHeight) || 150;
    const borderHeight = parseFloat(styles.borderTopWidth) + parseFloat(styles.borderBottomWidth);
    textarea.style.height = `${Math.max(textarea.scrollHeight + borderHeight, minHeight)}px`;
  }

  addCardTextareas.forEach(textarea => {
    textarea.addEventListener("input", () => resizeAddCardTextarea(textarea));
    resizeAddCardTextarea(textarea);
  });

  addCardForm.addEventListener("reset", () => {
    requestAnimationFrame(() => addCardTextareas.forEach(resizeAddCardTextarea));
  });

  disciplineSelect.addEventListener("change", () => {
    matterSelect.value = "";
    updateAddCardMatterOptions();
  });

  // Mostrar o modal ao clicar no botão "Adicionar"
  addButton.addEventListener("click", () => {
    addCardModal.style.display = "block";
  });

  // Fechar o modal ao clicar em "Cancelar"
  cancelAddCard.addEventListener("click", () => {
    addCardModal.style.display = "none";
    addCardForm.reset(); // Limpar o formulário
    updateAddCardMatterOptions();
  });

  // Salvar os dados ao clicar em "Salvar"
  addCardForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    // Coletar os dados do formulário
    const disciplinaFormAddCard = disciplineSelect.value.trim();
    const materiaFormAddCard = matterSelect.value.trim();
    const frenteFormTextarea = document.getElementById("frente-form-textarea").value;
    const versoFormTextarea = document.getElementById("verso-form-textarea").value;

    if (!disciplinaFormAddCard) {
      showAppNotification("Selecione uma disciplina da lista.");
      return;
    }
    const matterIsListed = addCardOptions.materias.some(item =>
      item.disciplina === disciplinaFormAddCard &&
      item.materia.toLocaleLowerCase("pt-BR") === materiaFormAddCard.toLocaleLowerCase("pt-BR")
    );
    if (!matterIsListed) {
      showAppNotification("Selecione uma matéria cadastrada para essa disciplina na aba APOIO.");
      return;
    }

    // Enviar os dados para a API
    saveAddCardButton.disabled = true;
    cancelAddCard.disabled = true;
    saveAddCardButton.textContent = "SALVANDO...";

    try {
      const savedCard = await sendApiMutation({
        action: "add",
        "disciplina-form-add-card": disciplinaFormAddCard,
        "materia-form-add-card": materiaFormAddCard,
        "frente-form-textarea": frenteFormTextarea,
        "verso-form-textarea": versoFormTextarea
      });

      // A confirmação da API significa que a planilha já foi atualizada.
      addCardModal.style.display = "none";
      addCardForm.reset();
      updateAddCardMatterOptions();

      // Atualizar a lista sem tratar falha de atualização como falha de gravação.
      try {
        await fetchAddCardOptions();
        await fetchFilters();
        await fetchCards();
        const savedCardIndex = data.findIndex(card =>
          String(card.id) === String(savedCard.id)
        );
        if (savedCardIndex >= 0) {
          data.unshift(data.splice(savedCardIndex, 1)[0]);
          currentCardIndex = 0;
          renderCard();
        }
        showAppNotification("Novo cartão adicionado com sucesso!");
      } catch (refreshError) {
        console.error("Cartão salvo, mas a lista não pôde ser atualizada:", refreshError);
        showAppNotification("O cartão foi salvo na planilha, mas não foi possível atualizar a lista. Recarregue o app para vê-lo.");
      }
    } catch (error) {
      console.error("Erro ao adicionar o cartão:", error);
      const detail = error instanceof Error ? error.message : String(error);
      showAppNotification(`Não foi possível adicionar o cartão. ${detail}`);
    } finally {
      saveAddCardButton.disabled = false;
      cancelAddCard.disabled = false;
      saveAddCardButton.textContent = "SALVAR";
    }
  });




// FIM DA FUNÇÃO PRINCIPAL
});
  
//FIM DO SCRIPT
</script>
