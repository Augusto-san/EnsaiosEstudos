<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>memoFULL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2a2a2a">
  <meta name="robots" content="noindex, nofollow">
  <base target="_top">

  <!--
  Estilos do CodeMirror
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/monokai.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/dracula.min.css">

  Scripts do CodeMirror
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/edit/closetag.min.js"></script>
  -->
  
  <style>
    /* Reset básico */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: #3a3a3a;
      color: #FFF;
      font-size: clamp(1rem, 2.5vw, 2rem);
      line-height: 1.5;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #2a2a2a;
      padding: 2px/*15px*/;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      z-index: 1000;
      position: fixed;
      width: 100%;
    }

    .header h2 {
      margin: 0;
      flex: 1;
      text-align: center;
    }

    .menu-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      background: none;
      border: none;
      color: #FFF;
      cursor: pointer;
      padding: 8px;
    }

    .menu-toggle svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 0px 0px 0px;
    }

    #api-access-gate {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      padding: 24px;
      background: rgba(42, 42, 42, 0.98);
      color: #fff;
    }

    #api-access-gate[hidden],
    #api-access-error[hidden] {
      display: none;
    }

    .api-access-panel {
      width: min(100%, 460px);
      padding: clamp(20px, 5vw, 32px);
      border: 1px solid #81ce39;
      border-radius: 10px;
      background: #2a2a2a;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      font-size: 16px;
      line-height: 1.45;
    }

    .api-access-brand {
      margin: 0 0 18px;
      color: #fff;
      font-size: 24px;
      text-align: center;
    }

    #api-access-title {
      margin: 0 0 8px;
      color: #81ce39;
      font-size: 21px;
      text-align: center;
    }

    .api-access-copy {
      margin: 0 0 20px;
      color: #e5e5e5;
      text-align: center;
    }

    #api-access-form label {
      display: block;
      margin-bottom: 6px;
      color: #81ce39;
      font-size: 14px;
    }

    .api-access-input-row {
      display: flex;
      gap: 8px;
    }

    #api-link-input {
      flex: 1 1 auto;
      width: 0;
      min-width: 0;
      padding: 11px 12px;
      border: 1px solid #777;
      border-radius: 6px;
      outline: none;
      background: #4a4a4a;
      color: #fff;
      font: inherit;
      font-size: 14px;
    }

    #api-link-input:focus {
      border-color: #81ce39;
      box-shadow: 0 0 0 2px rgba(129, 206, 57, 0.2);
    }

    #api-link-visibility {
      flex: 0 0 auto;
      padding: 0 12px;
      border: 1px solid #666;
      border-radius: 6px;
      background: #4a4a4a;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }

    #api-access-submit {
      width: 100%;
      margin-top: 14px;
      padding: 12px;
      border: 0;
      border-radius: 6px;
      background: #ffc100;
      color: #2a2a2a;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    #api-access-submit:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    #api-access-status,
    #api-access-error {
      margin: 12px 0 0;
      font-size: 14px;
      text-align: center;
    }

    #api-access-status {
      color: #e5e5e5;
    }

    #api-access-error {
      color: #ffc100;
    }

    .api-access-note {
      display: block;
      margin-top: 16px;
      color: #bdbdbd;
      font-size: 12px;
      text-align: center;
    }

    .content.no-review-session .buttons-container-header {
      overflow: hidden;
      padding-bottom: 0;
    }

    .content.no-review-session .buttons-container-header #add-button {
      flex: 1 1 0;
    }

    a {
      color: #6495ed;
    }
    
    .flashcard {
      border: 1px solid #81ce39;
      padding: 15px;
      margin: 10px 0px;
      text-align: center; /*justify;*/
      background-color: #4a4a4a;
      border-radius: 8px;
      width: 90%;
      /*max-width: 95%;*/
      font-size: clamp(1.1rem, 2vw, 1.3rem);
    }

    /*#front-content, #back-content, #cabecalho-frente, #cabecalho-verso*/

    #add-card-modal { 
      display: none; 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      overflow-y: auto;
      background: #3a3a3a; /*rgba(0, 0, 0, 0.8);*/ 
      color: white; 
      z-index: 9999;
    }

    #disciplina-form-add-card, #materia-form-add-card{
      border-radius: 7px;
    }

    #add-card-modal-in{
      max-width: 500px; 
      /*margin: 50px auto;*/ 
      padding: 20px; 
      background: #2a2a2a; /*black;*/ 
      border-radius: 5px;
    }


    #add-card-modal-in > h2 {
      text-align: center;
    }

    #frente-form-textarea, #verso-form-textarea {
     height: 96px;
     min-height: 96px;
     box-sizing: border-box;
     overflow-y: hidden;
     resize: none;
     border-radius: 7px;
     font: inherit;
     line-height: inherit;
     text-align: justify;
    }

    .label-add-card-form, #add-card-modal-in > h2 {
      color: #81ce39;
    }

    #front-content, #back-content {
      margin-top: 10px;
      text-align: justify;
      white-space: pre-wrap;
    }

    .front, .back {
      border: none;
      color: #FFF;
    }

    .card-heading {
      display: block;
      width: 100%;
      font-family: system-ui;
      color: #656565;
      font-weight: 700;
      line-height: 1.3;
    }

    .card-heading-label {
      display: block;
      width: 100%;
      text-align: center;
      letter-spacing: 0.22em;
    }

    .card-heading-data {
      display: block;
      width: 100%;
      margin-top: 2px;
    }

    .card-heading-field {
      display: block;
      width: 100%;
      text-align: center;
    }

    .card-metadata-editor {
      margin: 0 0 14px;
      text-align: left;
    }

    .card-metadata-field {
      margin-bottom: 10px;
    }

    .card-metadata-field label {
      display: block;
      margin-bottom: 5px;
      color: #81ce39;
      font-size: 14px;
    }

    .card-metadata-field input,
    .card-metadata-field select {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 7px;
      background-color: #fff;
      color: #0063cb;
      font: inherit;
    }

    hr {
      width: 100%;
      border: none;
      height: 1px;
      background-color: #81ce39;
      margin: 20px 0;
    }

    .flashcard .back {
      display: none;
      /*margin-top: 20px;*/
    }


    /* TEXTAREA EDITAR FRENTE e TEXTAREA EDITAR VERSO */
    #back-edit, #front-edit{
      width: 100%;
      height: 400px;
      color: #000000;
      background-color: #ffffff;
      font-family: Arial, sans-serif;
      overflow-y: scroll;
      max-width: 100%;
      min-width: 100%;
      line-height: 1.5;
      font-size: clamp(1rem, 2.5vw, 2rem);
      border-radius: 5px;
      padding: 15px;
      text-align: justify;
    }


    .footer {
      background-color: #2a2a2a;
      padding: 15px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: sticky;
      bottom: 0;
      width: 100%;
    }

    .flashcard[hidden],
    .footer[hidden] {
      display: none;
    }

    .buttons-container {
      display: flex;
      flex-direction: row; /*column;*/
      width: 100%;
      max-width: 95%;
      margin-bottom: 10px;
    }

    #result-buttons[hidden],
    #ocultar-btn[hidden] {
      display: none;
    }

    .buttons-container-header {
      display: flex;
      flex-direction: row; /*column;*/
      flex-wrap: nowrap;
      justify-content: flex-start;
      align-items: center;
      gap: 0;
      width: 100%;
      max-width: 95%;
      margin: 0 auto;
      /*margin-bottom: 10px;*/
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory;
      padding-bottom: 10px; /*Para evitar que a barra de rolagem sobreponha os botões*/
    }

    .buttons-container-header::-webkit-scrollbar {
      height: 8px; /* Altura da barra de rolagem */
    }

    .buttons-container-header::-webkit-scrollbar-thumb {
      background: #81ce39; /* Cor da barra de rolagem */
      border-radius: 4px;
    }

    .buttons-container-header::-webkit-scrollbar-track {
      background: #555555; /* Cor do fundo da barra de rolagem */
    }


    #excluir-button, #edit-button {
      font-size: 25px;
    }

    #edit-button {
      display: none;
    }


    #cancel-button, #counter-button, #br-copy-button, 
    #ppp-copy-button, #link-copy-button, #data-button, #excluir-button, #bold-button, #italic-button, #underline-button, #mark-button, #borda-button {
      display: none;
    }

    #edit-button, #cancel-button, #add-button, 
    #counter-button, #br-copy-button, #ppp-copy-button,
    #link-copy-button {
      font-size: 20px;
    }
    
    .buttons-container button {
      flex: 1; /* equivale a flex: 1 1 0; o item pode crescer, encolher e tem um tamanho inicial de 0

      flex: 0 1 auto; o item pode encolher, mas não cresce. Seu tamanho inicial é automático com base no conteúdo  */
      margin: 2% 2%;
      padding: 15px;
      font-size: 16px;
      line-height: 24px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background-color: #555555; /*#81ce39;*/
      color: #FFF;
      transition: background-color 0.3s;
    }

    /* ESTRUTURA FLEX:

      FLEX-GROW: controla a capacidade do item de crescer para ocupar espaço adicional

      FLEX-SHRINK: controla a capacidade do item de encolher quando há pouco espaço disponível

      FLEX-BASIS: define o tamanho inicial do item antes de aplicar o crescimento ou encolhimento

     */

    .buttons-container-header button {
      flex: 0 0 46%;
      min-width: 48px;
      /*0 0 20%;  
      FLEX-GROW: 0; o item não crescerá mesmo que haja espaço extra no container 

      FLEX-SHRINK: 0; o item não encolherá mesmo que o container não tenha espaço suficiente

      FLEX-BASIS: 25%; define o tamanho inicial do item como 25% proporcional ao container
      */
      margin: 2% 2%;
      padding: 15px;
      font-size: 16px;
      line-height: 24px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background-color: #555555; /*#81ce39;*/
      color: #FFF;
      transition: background-color 0.3s;
      scroll-snap-align: start;
    }

    .buttons-container button.active, .buttons-container-header button.active {
      background-color:#477d14;
      color: #FFF;
    }

    .buttons-container button.review-locked {
      opacity: 0.65;
      cursor: not-allowed;
    }

    #api-loading-indicator {
      position: fixed;
      inset: 0;
      z-index: 10002;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(0, 0, 0, 0.65);
      opacity: 0;
      visibility: hidden;
      transition: opacity 180ms ease, visibility 180ms;
      pointer-events: none;
    }

    #api-loading-indicator.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .loader {
      --color-1: #fff;
      --color-2: #FFC100;
      --size: 1px;

      width: calc(48 * var(--size));
      height: calc(48 * var(--size));
      border: calc(5 * var(--size)) solid var(--color-1);
      border-bottom-color: var(--color-2);
      border-radius: 50%;
      display: inline-block;
      box-sizing: border-box;
      animation: rotation 1s linear infinite;
    }

    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      #api-loading-indicator {
        transition: none;
      }

      .loader {
        animation: none;
      }
    }

    #favorite-button {
      display: none;
      font-size: 25px;
    }

    #favorite-button.active {
      color: #FFD700;
    }

    #app-notification {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 60px);
      left: 50%;
      z-index: 10001;
      max-width: calc(100vw - 32px);
      padding: 10px 16px;
      border: 1px solid #ffe033;
      border-radius: 8px;
      background-color: #e6c300;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.35);
      color: #424242;
      font-size: 16px;
      line-height: 1.4;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, -8px);
      transition: opacity 180ms ease, transform 180ms ease, visibility 180ms;
      pointer-events: none;
    }

    #app-notification.visible {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
    }

    @media (prefers-reduced-motion: reduce) {
      #app-notification {
        transition: none;
      }
    }
    
    .buttons-container button:hover, .buttons-container-header button:hover {
      background-color: #413f3f; /*#6da32e;*/
      border: 2px dotted #81ce39;
    }

    .add-card-formulario {
      width: 100%;
      max-width: 100%;
      min-width: 100%;
      margin-bottom: 10px;
    }

    input.add-card-formulario,
    select.add-card-formulario {
      height: 44px;
      min-height: 44px;
      box-sizing: border-box;
      padding: 0 10px;
      font-family: Arial, sans-serif;
      font-size: 16px;
      line-height: 1.4;
    }

    textarea.add-card-formulario {
      font: inherit;
      line-height: inherit;
      text-align: justify;
    }

    .navigation-buttons {
      display: flex;
      flex-direction: row;
      width:  100%;
      max-width: 95%;
    }

    .navigation-buttons[hidden] {
      display: none;
    }

    .navigation-buttons button {
      flex: 1;
      margin: 2% 2%; /*0 5px;*/
      padding: 10px;
      font-size: 21px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background-color: #555;
      color: #FFF;
    }

    .navigation-buttons button:hover {
      background-color: #413f3f; /*#444;*/
      border: 2px dotted #81ce39;
    }

    .side-menu {
      position: fixed;
      top: 0;
      left: -300px;
      width: 300px;
      height: 100%;
      background-color: #2a2a2a;
      color: #FFF;
      box-shadow: 2px 0 5px rgba(0, 0, 0, 0.5);
      padding: 20px;
      transition: left 0.3s ease;
      z-index: 1000;
    }

    .side-menu.open {
      left: 0;
    }

    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .menu-header h3 {
      margin: 0;
      color: #81ce39;
    }

    #close-menu {
      font-size: 20px;
      background: none;
      border: none;
      color: #ff0202;
      cursor: pointer;
    }

    .filters {
      margin-top: 16px;
    }

    .filters label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #81ce39;
    }

    .filters select,
    .filters input {
      width: 100%;
      margin-bottom: 8px;
      padding: 8px;
      font-size: 14px;
      border-radius: 5px;
      border: 1px solid #ccc;
      background-color: #fff;
      color: #0063cb; /*000;*/
    }

    .filters .filter-help {
      display: block;
      margin: -2px 0 10px;
      color: #fff;
      font-size: 12px;
      line-height: 1.35;
    }

    .field-divider {
      width: 100%;
      height: 1px;
      margin: 0 0 14px;
      background-color: #81ce39;
    }

    #apply-filters, #clear-filters {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      background-color: #3f7f04; /*81ce39;*/
      color: #FFF;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-bottom: 10px;
    }

    #apply-filters:hover, #clear-filters:hover,
    #apply-filters:focus, #clear-filters:focus,
    #apply-filters:active, #clear-filters:active {
      background-color: #3f7f04;
    }


  </style>
</head>

<body>
  <div id="api-access-gate" role="dialog" aria-modal="true" aria-labelledby="api-access-title">
    <section class="api-access-panel">
      <h1 class="api-access-brand">memoFULL 🧠</h1>
      <h2 id="api-access-title">Acesso ao aplicativo</h2>
      <p class="api-access-copy">Informe sua chave de acesso para carregar os cartões e iniciar o app.</p>
      <form id="api-access-form" novalidate>
        <label for="api-link-input">Chave de acesso</label>
        <div class="api-access-input-row">
          <input id="api-link-input" type="password" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="api-access-error" required>
          <button id="api-link-visibility" type="button" aria-pressed="false">Mostrar</button>
        </div>
        <button id="api-access-submit" type="submit">ACESSAR APP</button>
        <p id="api-access-status" role="status" aria-live="polite" hidden></p>
        <p id="api-access-error" role="alert" aria-live="assertive" hidden></p>
      </form>
      <small class="api-access-note">A chave fica nesta sessão da aba e é removida ao encerrá-la.</small>
    </section>
  </div>

  <div class="header">
    <button class="menu-toggle" id="home-button" type="button" aria-label="Início" title="Início">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M3 10.8 12 3l9 7.8"></path>
        <path d="M5.5 9.5V21h13V9.5M9.5 21v-7h5v7"></path>
      </svg>
    </button>
    <h2>&copy; memoFULL 🧠</h2>
    <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Abrir filtros" title="Abrir filtros" aria-controls="side-menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M3 5h18l-7 8v6l-4 2v-8L3 5z"></path>
      </svg>
    </button>
  </div>


  <div class="side-menu" id="side-menu">
    <div class="menu-header">
      <h3>Filtros</h3>
      <button id="close-menu">✖</button>
    </div>
    <div class="filters">
      <label for="id-cartao-filter">ID do cartão:</label>
      <input id="id-cartao-filter" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-describedby="id-cartao-filter-help" placeholder="Ex.: 123">
      <small class="filter-help" id="id-cartao-filter-help">Ao informar um ID, os outros filtros serão ignorados.</small>
      <div class="field-divider" aria-hidden="true"></div>
      <label for="disciplina-filter">Disciplina:</label>
        <select id="disciplina-filter">
          <option value="todos">Todos</option>
        </select>
      <div class="field-divider" aria-hidden="true"></div>
      <label for="materia-filter">Matéria:</label>
        <select id="materia-filter">
          <option value="todos">Todos</option>
        </select>
      <div class="field-divider" aria-hidden="true"></div>
      <label for="resultado-filter">Resultado:</label>
        <select id="resultado-filter">
          <option value="todos">Todos</option>
        </select>
      <div class="field-divider" aria-hidden="true"></div>
      <label for="data-filter">Data:</label> <!-- // 02-03-2025 -->  
        <select id="data-filter"> <!-- // 02-03-2025 -->  
          <option value="todos">Todos</option> <!-- // 02-03-2025 -->  
        </select> <!-- // 02-03-2025 -->  
      <div class="field-divider" aria-hidden="true"></div>
      <label for="favoritos-filter">Favoritos:</label>
        <select id="favoritos-filter">
          <option value="todos">Todos</option>
          <option value="sim">Somente favoritos</option>
        </select>
      <div class="field-divider" aria-hidden="true"></div>
      <button id="apply-filters">Aplicar Filtros</button>
      <button id="clear-filters">Limpar Filtros</button>
    </div>
  </div>

  <div class="content no-review-session">
    
    <div class="buttons-container-header">

      <button id="cancel-button">❌</button>
      <button id="add-button">➕</button>
      <button id="counter-button">0</button>
      <button id="br-copy-button">br</button>
            <button id="bold-button">𝐁</button>
            <button id="italic-button">ⅈ</button>
            <button id="underline-button">ḵ</button>

    <!-- FORM PARA ADICIONAR NOVO CARTÃO -->

    <div id="add-card-modal">
      <div id="add-card-modal-in">
        <h2>ADICIONAR NOVO CARTÃO</h2>

        <form id="add-card-form">
          <label class="label-add-card-form" for="disciplina-form-add-card">Disciplina</label>
          <select id="disciplina-form-add-card" name="disciplina-form-add-card" required class="add-card-formulario">
            <option value="">Selecione uma disciplina</option>
          </select>

          <select id="materia-form-add-card" name="materia-form-add-card" required class="add-card-formulario" disabled>
            <option value="">Selecione uma disciplina primeiro</option>
          </select>
          <div class="field-divider" aria-hidden="true"></div>
          <label class="label-add-card-form" for="frente-form-textarea">Frente</label>
            <textarea id="frente-form-textarea" name="frente-form-textarea" required class="add-card-formulario"></textarea>
          <div class="field-divider" aria-hidden="true"></div>
          <label class="label-add-card-form" for="verso-form-textarea">Verso</label>
            <textarea id="verso-form-textarea" name="verso-form-textarea" required class="add-card-formulario"></textarea>
          <div class="field-divider" aria-hidden="true"></div>

          <div class="buttons-container">
            <button type="button" id="cancel-add-card" style="margin-right: 10px;">CANCELAR</button>

    <div id="result-buttons" class="buttons-container" hidden>
      <button data-resultado="ACERTEI">ACERTEI (0)</button>
      <!--<button data-resultado="médio">MÉDIO</button>-->
      <button data-resultado="ERREI">ERREI (0)</button>
    </div>
  </div>

    <div class="buttons-container">
      <button id="mostrar-btn" hidden>MOSTRAR VERSO</button>
      <button id="ocultar-btn" hidden>OCULTAR VERSO</button>
    </div>
    <div class="navigation-buttons" id="navigation-buttons" hidden>
      <button id="anterior-btn">ᐊ</button>
      <button id="proximo-btn">ᐅ</button>
    </div>
  </div>

<script>
const API_URL_SESSION_KEY = "memofull_api_endpoint";
let APPS_SCRIPT_API_URL = "";

document.addEventListener("DOMContentLoaded", async function () {
  let data = [];
  let currentCardIndex = 0;
  let totalCards = 0;
  let activeReviewSessionId = "";
  let nextReviewCursor = null;
  let hasMoreReviewPages = false;
  let nextReviewPageRequest = null;
  let filterOptionsRequestId = 0;
  let remainingCards = 0;
  const favoriteButton = document.getElementById("favorite-button");
  const appNotification = document.createElement("div");
  appNotification.id = "app-notification";
  appNotification.setAttribute("role", "status");
  appNotification.setAttribute("aria-live", "polite");
  appNotification.setAttribute("aria-atomic", "true");
  document.body.appendChild(appNotification);
  let appNotificationTimer = null;

  const apiLoadingIndicator = document.createElement("div");
  apiLoadingIndicator.id = "api-loading-indicator";
  apiLoadingIndicator.setAttribute("role", "status");
  apiLoadingIndicator.setAttribute("aria-live", "polite");
  apiLoadingIndicator.setAttribute("aria-atomic", "true");
  apiLoadingIndicator.setAttribute("aria-label", "Carregando");
  apiLoadingIndicator.setAttribute("aria-hidden", "true");
  const apiLoadingSpinner = document.createElement("span");
  apiLoadingSpinner.className = "loader";
  apiLoadingSpinner.setAttribute("aria-hidden", "true");
  apiLoadingIndicator.appendChild(apiLoadingSpinner);
  document.body.appendChild(apiLoadingIndicator);

  const apiAccessGate = document.getElementById("api-access-gate");
  const apiAccessForm = document.getElementById("api-access-form");
  const apiLinkInput = document.getElementById("api-link-input");
  const apiLinkVisibilityButton = document.getElementById("api-link-visibility");
  const apiAccessSubmitButton = document.getElementById("api-access-submit");
  const apiAccessStatus = document.getElementById("api-access-status");
  const apiAccessError = document.getElementById("api-access-error");
  const appElementsToLock = Array.from(document.body.children).filter(element =>
    element !== apiAccessGate && element.tagName !== "SCRIPT"
  );

  function setApiAccessGateOpen(isOpen) {
    apiAccessGate.hidden = !isOpen;
    appElementsToLock.forEach(element => { element.inert = isOpen; });
  }

  const activeApiRequests = new Set();
  let nextApiRequestId = 0;
  let apiLoadingVisibilityTimer = null;
  const API_LOADING_DELAY_MS = 120;

  function updateApiLoadingIndicator() {
    if (activeApiRequests.size === 0) {
      window.clearTimeout(apiLoadingVisibilityTimer);
      apiLoadingVisibilityTimer = null;
      apiLoadingIndicator.classList.remove("visible");
      apiLoadingIndicator.setAttribute("aria-hidden", "true");
      return;
    }

    if (!apiLoadingIndicator.classList.contains("visible") && apiLoadingVisibilityTimer === null) {
      apiLoadingVisibilityTimer = window.setTimeout(() => {
        apiLoadingVisibilityTimer = null;
        if (activeApiRequests.size === 0) return;

        apiLoadingIndicator.classList.add("visible");
        apiLoadingIndicator.setAttribute("aria-hidden", "false");
      }, API_LOADING_DELAY_MS);
    }
  }

  function beginApiRequest() {
    const requestId = ++nextApiRequestId;
    activeApiRequests.add(requestId);
    updateApiLoadingIndicator();
    return requestId;
  }

  function finishApiRequest(requestId) {
    activeApiRequests.delete(requestId);
    updateApiLoadingIndicator();
  }

  let addCardOptions = { disciplinas: [], materias: [] };

  function showAppNotification(message) {
    window.clearTimeout(appNotificationTimer);
    appNotification.classList.remove("visible");
    appNotification.textContent = "";

    requestAnimationFrame(() => {
      appNotification.textContent = message;
      appNotification.classList.add("visible");
      appNotificationTimer = window.setTimeout(() => {
        appNotification.classList.remove("visible");
      }, 4500);
    });
  }

  async function callAppsScript(method, parameters = {}) {
    if (!APPS_SCRIPT_API_URL) {
      throw new Error("Informe o link /exec da API antes de usar o aplicativo.");
    }

    let requestUrl = APPS_SCRIPT_API_URL;
    let requestOptions;
    const getActions = {
      getBootstrap: "bootstrap",
      getFilterOptions: "filters",
      startReviewSession: "session",
      getReviewPage: "page"
    };
    if (Object.prototype.hasOwnProperty.call(getActions, method)) {
      const query = new URLSearchParams({ action: getActions[method] });
      Object.entries(parameters).forEach(([key, value]) => {
        if (value != null) query.set(key, String(value));
      });
      requestUrl += `?${query.toString()}`;
      requestOptions = {
        method: "GET",
        cache: "no-store",
        redirect: "follow"
      };
    } else if (method === "addCard" || method === "saveCard" || method === "recordCardResult") {
      const payload = {
        ...parameters,
        action: method === "addCard" ? "add" : method === "recordCardResult" ? "result" : "update"
      };
      const body = new URLSearchParams();
      Object.entries(payload).forEach(([key, value]) => {
        body.append(key, value == null ? "" : String(value));
      });
      requestOptions = {
        method: "POST",
        body,
        redirect: "follow"
      };
    } else {
      throw new Error("Função da API desconhecida.");
    }

    const requestId = beginApiRequest();
    try {
      const response = await fetch(requestUrl, requestOptions);
      const responseText = await response.text();
      let result;

      try {
        result = JSON.parse(responseText);
      } catch (error) {
        throw new Error("A API não retornou JSON. Confira a URL e a implantação do Apps Script.");
      }

      if (!response.ok) {
        throw new Error((result && result.error) || `Falha na API (${response.status}).`);
      }
      if (result && result.success === false) {
        throw new Error(result.error || "A API informou que a operação falhou.");
      }

      return result;
    } finally {
      finishApiRequest(requestId);
    }
  }

  function normalizeApiEndpoint(value) {
    let endpoint;
    try {
      endpoint = new URL(String(value == null ? "" : value).trim());
    } catch (error) {
      return "";
    }

    const pathParts = endpoint.pathname.split("/");
    const validDeploymentPath = pathParts.length === 5 &&
      pathParts[1] === "macros" &&
      pathParts[2] === "s" &&
      /^[A-Za-z0-9_-]+$/.test(pathParts[3]) &&
      pathParts[4] === "exec";
    if (endpoint.protocol !== "https:" ||
        endpoint.hostname !== "script.google.com" ||
        endpoint.port || endpoint.username || endpoint.password ||
        endpoint.search || endpoint.hash || !validDeploymentPath) {
      return "";
    }

    return endpoint.origin + endpoint.pathname;
  }

  function showApiAccessError(message) {
    apiAccessStatus.hidden = true;
    apiAccessStatus.textContent = "";
    apiAccessError.textContent = message;
    apiAccessError.hidden = false;
    apiLinkInput.setAttribute("aria-invalid", "true");
  }

  function clearApiAccessFeedback() {
    apiAccessError.hidden = true;
    apiAccessError.textContent = "";
    apiLinkInput.removeAttribute("aria-invalid");
  }

  async function connectToApi(endpointText, rememberForTab) {
    const endpoint = normalizeApiEndpoint(endpointText);
    if (!endpoint) {
      showApiAccessError("Insira a chave para continuar");
      apiLinkInput.focus();
      return false;
    }

    clearApiAccessFeedback();
    APPS_SCRIPT_API_URL = endpoint;
    apiAccessSubmitButton.disabled = true;
    apiAccessSubmitButton.textContent = "CONECTANDO...";
    apiAccessStatus.textContent = "Validando o link e carregando as opções do app...";
    apiAccessStatus.hidden = false;

    try {
      await fetchFilters();
      if (rememberForTab) {
        try {
          window.sessionStorage.setItem(API_URL_SESSION_KEY, endpoint);
        } catch (storageError) {
          console.info("O navegador não permitiu guardar o link nesta sessão da aba.", storageError);
        }
      }

      apiLinkInput.value = "";
      apiLinkInput.type = "password";
      apiLinkVisibilityButton.textContent = "Mostrar";
      apiLinkVisibilityButton.setAttribute("aria-pressed", "false");
      setApiAccessGateOpen(false);
      document.getElementById("menu-toggle").focus();
      return true;
    } catch (error) {
      APPS_SCRIPT_API_URL = "";
      try {
        window.sessionStorage.removeItem(API_URL_SESSION_KEY);
      } catch (storageError) {
        // O link não é persistido se sessionStorage estiver indisponível.
      }
      const detail = error instanceof Error ? error.message : String(error);
      showApiAccessError(`Não foi possível conectar à API. Confira o link e tente novamente. ${detail}`);
      return false;
    } finally {
      apiAccessSubmitButton.disabled = false;
      apiAccessSubmitButton.textContent = "ACESSAR APP";
      apiAccessStatus.hidden = true;
      apiAccessStatus.textContent = "";
    }
  }

  function initializeApiAccessGate() {
    apiAccessGate.hidden = false;
    setApiAccessGateOpen(true);

    apiAccessForm.addEventListener("submit", event => {
      event.preventDefault();
      connectToApi(apiLinkInput.value, true);
    });
    apiLinkInput.addEventListener("input", clearApiAccessFeedback);
    apiLinkVisibilityButton.addEventListener("click", () => {
      const showLink = apiLinkInput.type === "password";
      apiLinkInput.type = showLink ? "text" : "password";
      apiLinkVisibilityButton.textContent = showLink ? "Ocultar" : "Mostrar";
      apiLinkVisibilityButton.setAttribute("aria-pressed", String(showLink));
      apiLinkInput.focus();
    });

    let storedEndpoint = "";
    try {
      storedEndpoint = window.sessionStorage.getItem(API_URL_SESSION_KEY) || "";
    } catch (storageError) {
      // Se o armazenamento da sessão estiver bloqueado, o link será solicitado nesta abertura.
    }

    if (storedEndpoint && normalizeApiEndpoint(storedEndpoint)) {
      apiLinkInput.value = storedEndpoint;
      connectToApi(storedEndpoint, false);
      return;
    }

    if (storedEndpoint) {
      try {
        window.sessionStorage.removeItem(API_URL_SESSION_KEY);
      } catch (storageError) {
        // O armazenamento continua sendo opcional.
      }
      showApiAccessError("O link salvo nesta sessão não é válido. Cole novamente o endereço da API.");
    }

    window.requestAnimationFrame(() => apiLinkInput.focus());
  }

  async function sendApiMutation(parameters) {
    const method = parameters.action === "add"
      ? "addCard"
      : parameters.action === "result"
        ? "recordCardResult"
        : "saveCard";
    const result = await callAppsScript(method, parameters);
    if (!result || result.success !== true) {
      throw new Error((result && result.error) || "O Apps Script não confirmou a gravação.");
    }

    return result;
  }

  function cardMutationReference(card) {
    if (!card || card.id == null || String(card.id).trim() === "") {
      throw new Error("O cartão não possui ID_CARTAO e não pode ser atualizado.");
    }
    return { id: card.id };
  }

  // AUXILIAR NO CONTADOR DE CARTÕES
  let isSavingFavorite = false;
  let isSavingDeletionMarker = false;
  const reviewedResultCardIds = new Set();
  let pendingReviewResult = null;
  let isChangingReviewContext = false;

  function setReviewContextChanging(isChanging) {
    isChangingReviewContext = isChanging;
    if (data.length > 0) {
      updateResultButtonStates(data[currentCardIndex]);
    } else if (isChanging) {
      document.querySelectorAll("[data-resultado]").forEach(button => {
        button.disabled = true;
      });
    }
  }

  function resetReviewSession() {
    reviewedResultCardIds.clear();
    pendingReviewResult = null;
  }

  function setReviewSurfaceVisible(isVisible) {
    document.querySelector(".content").classList.toggle("no-review-session", !isVisible);
    document.getElementById("flashcard").hidden = !isVisible;
    document.getElementById("review-footer").hidden = !isVisible;
  }

  function setReviewSessionPage(page, options = {}) {
    resetReviewSession();
    data = page.cards.map(card => ({ ...card, resultado: card.resultado ?? "" }));
    currentCardIndex = 0;
    totalCards = page.total;
    remainingCards = totalCards;
    activeReviewSessionId = page.sessionId;
    nextReviewCursor = page.nextCursor;
    hasMoreReviewPages = page.hasMore;
    nextReviewPageRequest = null;

    setReviewSurfaceVisible(data.length > 0);
    updateCardCounter();
    setAnswerVisibility(false);
    if (data.length > 0) {
      favoriteButton.style.display = "inline-block";
      document.getElementById("edit-button").style.display = "inline-block";
      document.getElementById("counter-button").style.display = "inline-block";
      document.getElementById("data-button").style.display = "inline-block";
      document.getElementById("excluir-button").style.display = "inline-block";
      document.getElementById("navigation-buttons").hidden = false;
      renderCard();
    } else {
      favoriteButton.style.display = "none";
      document.getElementById("edit-button").style.display = "none";
      document.getElementById("counter-button").style.display = "none";
      document.getElementById("data-button").style.display = "none";
      document.getElementById("excluir-button").style.display = "none";
      document.getElementById("navigation-buttons").hidden = true;
      ["cabecalho-frente", "front-content", "cabecalho-verso", "back-content"].forEach(elementId => {
        document.getElementById(elementId).replaceChildren();
      });
      if (options.notifyEmpty !== false) {
        showAppNotification("Nenhum cartão encontrado com os filtros aplicados.");
      }
    }
  }

  async function loadNextReviewPage() {
    if (nextReviewPageRequest) return nextReviewPageRequest;
    if (!activeReviewSessionId || !nextReviewCursor || !hasMoreReviewPages) return false;

    const sessionId = activeReviewSessionId;
    const cursor = nextReviewCursor;
    const request = callAppsScript("getReviewPage", { sessionId, cursor })
      .then(response => {
        const page = validateReviewPage(response);
        if (activeReviewSessionId !== sessionId) return false;
        if (page.sessionId !== sessionId || page.total !== totalCards) {
          throw new Error("A API devolveu uma página de outra sessão de cartões.");
        }

        data = data.concat(page.cards.map(card => ({ ...card, resultado: card.resultado ?? "" })));
        nextReviewCursor = page.nextCursor;
        hasMoreReviewPages = page.hasMore;
        return true;
      })
      .finally(() => {
        if (nextReviewPageRequest === request) nextReviewPageRequest = null;
      });
    nextReviewPageRequest = request;
    return request;
  }

  function maybePrefetchReviewPage() {
    if (!hasMoreReviewPages || !nextReviewCursor ||
        data.length - currentCardIndex > 10) return;
    loadNextReviewPage().catch(error => {
      console.warn("Não foi possível pré-carregar a próxima página:", error);
    });
  }

  async function commitPendingReviewResult() {
    const pending = pendingReviewResult;
    if (!pending) return true;
    if (pending.commitPromise) return pending.commitPromise;

    pending.commitPromise = (async () => {
      try {
        const savedCard = await sendApiMutation({
          action: "result",
          id: pending.cardId,
          resultado: pending.result,
          dataRevisao: pending.dataRevisao
        });

        if (!Number.isSafeInteger(savedCard.qtd_acertos) || savedCard.qtd_acertos < 0 ||
            !Number.isSafeInteger(savedCard.qtd_erros) || savedCard.qtd_erros < 0) {
          throw new Error("A API não devolveu os contadores inteiros atualizados.");
        }

        pending.card.qtd_acertos = Math.max(pending.card.qtd_acertos, savedCard.qtd_acertos);
        pending.card.qtd_erros = Math.max(pending.card.qtd_erros, savedCard.qtd_erros);
        pending.card.resultado = savedCard.resultado;
        const dateWasSaved = typeof savedCard.data_revisao === "string" &&
          formatReviewDateForDisplay(savedCard.data_revisao) ===
            formatReviewDateForDisplay(pending.dataRevisao);
        if (dateWasSaved) pending.card.data_revisao = savedCard.data_revisao;
        reviewedResultCardIds.add(pending.cardId);
        if (pendingReviewResult === pending) pendingReviewResult = null;

        if (data[currentCardIndex] === pending.card) {
          updateResultCounters(pending.card);
          updateResultButtonStates(pending.card);
          if (dateWasSaved) updateReviewDateButton(pending.card);
        }
        showAppNotification(dateWasSaved
          ? `Resultado e data de revisão (${formatReviewDateForDisplay(pending.card.data_revisao)}) salvos. Acertos: ${pending.card.qtd_acertos} · Erros: ${pending.card.qtd_erros}.`
          : "Resultado registrado, mas a API não confirmou a data de revisão. Publique a versão atualizada do Apps Script.");
        return true;
      } catch (error) {
        console.error("Error saving result:", error);
        const detail = error instanceof Error ? error.message : String(error);
        showAppNotification(`Não foi possível salvar o resultado. ${detail}`);
        pending.commitPromise = null;
        return false;
      }
    })();

    return pending.commitPromise;
  }

  function validateReviewPage(page) {
    if (!page || page.success !== true ||
        !/^[a-f0-9]{32}$/i.test(String(page.sessionId || "")) ||
        !Array.isArray(page.cards) ||
        !Number.isSafeInteger(page.total) || page.total < 0 ||
        typeof page.hasMore !== "boolean" ||
        (page.hasMore && (typeof page.nextCursor !== "string" || !page.nextCursor)) ||
        (!page.hasMore && page.nextCursor !== null)) {
      throw new Error("A API retornou uma página de cartões inválida. Atualize a implantação do Apps Script.");
    }
    if (page.cards.length > 75 || page.cards.some(card =>
      !card || typeof card !== "object" ||
      !Object.prototype.hasOwnProperty.call(card, "materia") ||
      !Object.prototype.hasOwnProperty.call(card, "conteudo") ||
      !Object.prototype.hasOwnProperty.call(card, "resultado") ||
      !Object.prototype.hasOwnProperty.call(card, "qtd_acertos") ||
      !Object.prototype.hasOwnProperty.call(card, "qtd_erros") ||
      !Number.isSafeInteger(card.qtd_acertos) || card.qtd_acertos < 0 ||
      !Number.isSafeInteger(card.qtd_erros) || card.qtd_erros < 0
    )) {
      throw new Error("A página não contém os cartões e contadores esperados pela interface.");
    }
    return page;
  }

  function validateFilterOptions(options) {
    return options &&
      Array.isArray(options.disciplinas) &&
      Array.isArray(options.materias) &&
      Array.isArray(options.resultados) &&
      Array.isArray(options.datas);
  }

  async function fetchFilters(filters = {}) {
    if (isChangingReviewContext) throw new Error("Aguarde a mudança atual de cartão ou filtros.");
    setReviewContextChanging(true);
    try {
      if (!(await commitPendingReviewResult())) {
        throw new Error("A seleção atual não foi gravada; os cartões não foram recarregados.");
      }
      const bootstrap = await callAppsScript("getBootstrap", filters);
      if (!bootstrap || bootstrap.success !== true ||
          !validateFilterOptions(bootstrap.filters) ||
          !bootstrap.addCardOptions ||
          !Array.isArray(bootstrap.addCardOptions.disciplinas) ||
          !Array.isArray(bootstrap.addCardOptions.materias)) {
        throw new Error("A resposta inicial da API está incompleta. Atualize a implantação do Apps Script.");
      }

      addCardOptions = bootstrap.addCardOptions;
      populateAddCardDisciplineOptions();
      populateFilters(bootstrap.filters, filters);
    } finally {
      setReviewContextChanging(false);
    }
  }

  function populateAddCardDisciplineOptions() {
    const disciplineSelect = document.getElementById("disciplina-form-add-card");
    disciplineSelect.replaceChildren();

    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "Selecione uma disciplina";
    disciplineSelect.appendChild(placeholder);

    sortedUniqueFilterValues(addCardOptions.disciplinas).forEach(discipline => {
      const option = document.createElement("option");
      option.value = discipline;
      option.textContent = normalizeFilterOptionLabel(discipline);
      disciplineSelect.appendChild(option);
    });

    updateAddCardMatterOptions();
  }

  function updateAddCardMatterOptions() {
    const disciplineSelect = document.getElementById("disciplina-form-add-card");
    const matterSelect = document.getElementById("materia-form-add-card");
    const selectedDiscipline = disciplineSelect.value;
    const availableMatters = selectedDiscipline
      ? addCardOptions.materias.filter(item => item.disciplina === selectedDiscipline)
      : [];

    matterSelect.replaceChildren();
    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = selectedDiscipline
      ? "Selecione uma matéria"
      : "Selecione uma disciplina primeiro";
    matterSelect.appendChild(placeholder);
    matterSelect.disabled = !selectedDiscipline;

    sortedUniqueFilterValues(availableMatters.map(item => item.materia)).forEach(matter => {
      const option = document.createElement("option");
      option.value = matter;
      option.textContent = normalizeFilterOptionLabel(matter);
      matterSelect.appendChild(option);
    });
  }

  function getReviewDateAtClick() {
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Sao_Paulo",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).formatToParts(new Date());
    const dateParts = {};
    parts.forEach(part => {
      if (part.type !== "literal") dateParts[part.type] = part.value;
    });
    return `${dateParts.year}-${dateParts.month}-${dateParts.day}`;
  }

  function formatReviewDateForDisplay(value) {
    const text = String(value == null ? "" : value).trim();
    if (!text || /^[-–—]$/.test(text)) return "📅";

    const isoDate = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:$|T)/);
    if (isoDate) {
      return `${isoDate[3].padStart(2, "0")}/${isoDate[2].padStart(2, "0")}/${isoDate[1]}`;
    }

    const brazilianDate = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (brazilianDate) {
      return `${brazilianDate[1].padStart(2, "0")}/${brazilianDate[2].padStart(2, "0")}/${brazilianDate[3]}`;
    }

    const parsedDate = new Date(text);
    return Number.isNaN(parsedDate.getTime())
      ? text
      : new Intl.DateTimeFormat("pt-BR", { timeZone: "America/Sao_Paulo" }).format(parsedDate);
  }

  function updateReviewDateButton(card) {
    const dateLabel = formatReviewDateForDisplay(card && card.data_revisao);
    const accessibleLabel = dateLabel === "📅"

        Array.from(favoritesFilter.options).some(option => option.value === String(selected.favoritos))) {

    }
  }

  const filterCollator = new Intl.Collator("pt-BR", {
    numeric: true,
    sensitivity: "base"
  });

  function normalizeFilterOptionLabel(value) {
    return String(value == null ? "" : value)
      .replace(/\u00a0/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function sortedUniqueFilterValues(values) {
    return Array.from(new Set(values.map(value => String(value == null ? "" : value))))
      .filter(value => normalizeFilterOptionLabel(value) !== "")
      .sort((a, b) => {
        const byLabel = filterCollator.compare(
          normalizeFilterOptionLabel(a),
          normalizeFilterOptionLabel(b)
        );
        return byLabel || filterCollator.compare(a, b);
      });
  }

  function parseFilterDate(value) {
    if (!value) return null;
    if (value instanceof Date) {
      return Number.isNaN(value.getTime()) ? null : value;
    }

    const text = String(value).trim();
    if (!text || text === "-") return null;

    const isoDate = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (isoDate) {
      return new Date(Number(isoDate[1]), Number(isoDate[2]) - 1, Number(isoDate[3]));
    }

    const brazilianDate = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (brazilianDate) {
      return new Date(Number(brazilianDate[3]), Number(brazilianDate[2]) - 1, Number(brazilianDate[1]));
    }

    const parsed = new Date(text);
    return Number.isNaN(parsed.getTime()) ? null : parsed;
  }

  function formatFilterDate(value) {
    const date = parseFilterDate(value);
    return date ? date.toLocaleDateString("pt-BR") : "";
  }

  function compareFilterDateLabels(first, second) {
    const [firstDay, firstMonth, firstYear] = first.split("/").map(Number);
    const [secondDay, secondMonth, secondYear] = second.split("/").map(Number);
    return firstYear - secondYear || firstMonth - secondMonth || firstDay - secondDay;
  }

  function populateFilterSelect(elementId, values, selectedValue, sortDates = false) {
    const select = document.getElementById(elementId);
    const uniqueValues = sortedUniqueFilterValues(values);
    if (sortDates) uniqueValues.sort(compareFilterDateLabels);

    select.replaceChildren();
    const allOption = document.createElement("option");
    allOption.value = "todos";
    allOption.textContent = "Todos";
    select.appendChild(allOption);
    uniqueValues.forEach(value => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = normalizeFilterOptionLabel(value);
      select.appendChild(option);
    });

    const selected = selectedValue == null ? "todos" : String(selectedValue);
    select.value = uniqueValues.includes(selected) || selected === "todos" ? selected : "todos";
  }

  function updateDisciplineFilter(values, selectedValue) {
    populateFilterSelect("disciplina-filter", values, selectedValue);
  }

  function updateMatterFilter(values, selectedValue) {
    populateFilterSelect("materia-filter", values, selectedValue);
  }

  function updateResultFilter(values, selectedValue) {
    populateFilterSelect("resultado-filter", values, selectedValue);
  }

  function updateDataFilter(values, selectedValue) {
    populateFilterSelect("data-filter", values, selectedValue, true);
  }

  function getSelectedReviewFilters() {
    return {
      disciplina: document.getElementById("disciplina-filter").value,
      materia: document.getElementById("materia-filter").value,
      resultado: document.getElementById("resultado-filter").value,

    };

  function readCardIdFilter() {
    const input = document.getElementById("id-cartao-filter");
    const value = input.value.trim();
    if (!value) return null;

    if (!/^\d+$/.test(value)) {
      showAppNotification("Informe o ID do cartão usando apenas números inteiros.");
      input.focus();
      return undefined;
    }

    const id = Number(value);
    if (!Number.isSafeInteger(id) || id < 1) {
      showAppNotification("Informe um ID do cartão inteiro positivo válido.");
      input.focus();
      return undefined;
    }

    input.value = String(id);
    return String(id);
  }

  async function refreshDependentFilterOptions(changedFilter) {
    if (changedFilter === "disciplina") {
      document.getElementById("materia-filter").value = "todos";
      document.getElementById("resultado-filter").value = "todos";
      document.getElementById("data-filter").value = "todos";
    } else if (changedFilter === "materia") {
      document.getElementById("resultado-filter").value = "todos";
      document.getElementById("data-filter").value = "todos";
    } else if (changedFilter === "resultado") {
      document.getElementById("data-filter").value = "todos";
    }

    const requestId = ++filterOptionsRequestId;
    const selections = getSelectedReviewFilters();
    const dependentIds = changedFilter === "disciplina"
      ? ["materia-filter", "resultado-filter", "data-filter"]
      : changedFilter === "materia"
        ? ["resultado-filter", "data-filter"]
        : ["data-filter"];
    dependentIds.forEach(id => { document.getElementById(id).disabled = true; });
    try {
      const options = await callAppsScript("getFilterOptions", selections);
      if (requestId !== filterOptionsRequestId) return;
      populateFilters(options, getSelectedReviewFilters());
    } catch (error) {
      if (requestId !== filterOptionsRequestId) return;
      console.error("Erro ao atualizar as opções dos filtros:", error);
      const detail = error instanceof Error ? error.message : String(error);
      showAppNotification(`Não foi possível atualizar as opções dos filtros. ${detail}`);
    } finally {
      if (requestId === filterOptionsRequestId) {
        dependentIds.forEach(id => { document.getElementById(id).disabled = false; });
      }
    }
  }

// APLICA OS FILTROS
async function applyFilters(options = {}) {
  if (isChangingReviewContext) return false;
  const idCartaoFilter = readCardIdFilter();
  if (idCartaoFilter === undefined) return false;
  if (["materia-filter", "resultado-filter", "data-filter"].some(id =>
    document.getElementById(id).disabled
  )) {
    showAppNotification("Aguarde a atualização das opções dos filtros.");
    return false;
  }
  setReviewContextChanging(true);

  try {
    if (!(await commitPendingReviewResult())) return false;
    const filters = getSelectedReviewFilters();
    const sessionParameters = idCartaoFilter != null
      ? { idCartao: idCartaoFilter }
      : options.prioritizeId == null
        ? filters
        : { ...filters, prioritizeId: options.prioritizeId };
    const page = validateReviewPage(await callAppsScript("startReviewSession", sessionParameters));
    if (idCartaoFilter != null) {
      const exactIdSearch = page.total === 0
        ? page.cards.length === 0
        : page.total === 1 && page.cards.length === 1 &&
          String(page.cards[0].id) === idCartaoFilter;
      if (!exactIdSearch) {
        throw new Error("A API publicada ainda não oferece busca por ID. Atualize e publique o Apps Script.");
      }
    }
    setReviewSessionPage(page, {
      ...options,
      notifyEmpty: idCartaoFilter ? false : options.notifyEmpty
    });
    if (idCartaoFilter && page.total === 0 && options.notifyEmpty !== false) {
      showAppNotification(`Nenhum cartão encontrado com o ID ${idCartaoFilter}.`);
    }
    return true;
  } finally {
    setReviewContextChanging(false);
  }
}

    return ["SIM", "TRUE", "YES", "1"].includes(normalized);

// LIMPAR FILTROS E ESCONDER CONTADOR E BOTÃO DATA
async function clearFilters() {
  if (isChangingReviewContext) return false;
  setReviewContextChanging(true);

  try {
    if (!(await commitPendingReviewResult())) return false;
    resetReviewSession();

    document.getElementById("disciplina-filter").value = "todos";
    document.getElementById("materia-filter").value = "todos";
    document.getElementById("resultado-filter").value = "todos";
    document.getElementById("data-filter").value = "todos";
    document.getElementById("favoritos-filter").value = "todos";
    document.getElementById("id-cartao-filter").value = "";
    filterOptionsRequestId += 1;
    ["materia-filter", "resultado-filter", "data-filter"].forEach(id => {
      document.getElementById(id).disabled = false;
    });
    try {
      const filterOptions = await callAppsScript("getFilterOptions", {
        disciplina: "todos",
        materia: "todos",
        resultado: "todos"
      });
      populateFilters(filterOptions, {
        disciplina: "todos",
        materia: "todos",
        resultado: "todos",
        dataRevisao: "todos",
        favoritos: "todos"
      });
    } catch (error) {
      console.error("Erro ao restaurar as opções dos filtros:", error);
      showAppNotification("Os filtros foram limpos, mas suas opções não puderam ser atualizadas.");
    }

    // Limpa os dados e reseta o índice dos cartões
    data = [];
    currentCardIndex = 0;
    totalCards = 0;
    remainingCards = 0;
    activeReviewSessionId = "";
    nextReviewCursor = null;
    hasMoreReviewPages = false;
    nextReviewPageRequest = null;

    setReviewSurfaceVisible(false);
    // Atualiza o contador de cartões e esconde caso não tenha cartões
    updateCardCounter();
    setAnswerVisibility(false);
    
    if (data.length === 0) {
        document.getElementById("counter-button").style.display = "none"; // Oculta contador de cartões

        document.getElementById("data-button").style.display = "none"; // Oculta botão de data

        document.getElementById("edit-button").style.display = "none";
        document.getElementById("excluir-button").style.display = "none"; // Ocultar botão excluir
        document.getElementById("favorite-button").style.display = "none";
        document.getElementById("navigation-buttons").hidden = true;

    }

    // Remove o conteúdo dos cartões
    ["cabecalho-frente", "front-content", "cabecalho-verso", "back-content"].forEach(elementId => {
      document.getElementById(elementId).replaceChildren();
    });
    document.querySelectorAll("[data-resultado]").forEach(button => {
      button.disabled = true;
    });
    return true;
  } finally {
    setReviewContextChanging(false);
  }
}

  // BOTÃO PRÓXIMO QUE ATUALIZA O CONTADOR
  async function navigateReviewCards(direction) {
    if (data.length === 0 || isChangingReviewContext) return;
    setReviewContextChanging(true);

    try {
      if (!(await commitPendingReviewResult())) return;

      if (direction === "next") {
        let nextIndex = currentCardIndex + 1;
        if (nextIndex >= data.length && hasMoreReviewPages) {
          try {
            await loadNextReviewPage();
          } catch (error) {
            console.error("Erro ao carregar a próxima página de cartões:", error);
            const detail = error instanceof Error ? error.message : String(error);
            showAppNotification(`Não foi possível carregar os próximos cartões. ${detail}`);
            return;
          }
        }

        if (nextIndex < data.length) {
          currentCardIndex = nextIndex;
          remainingCards = totalCards - currentCardIndex;
          updateCardCounter();
          renderCard();
        } else {
          showAppNotification("Este é o último cartão!");
        }
      } else if (currentCardIndex > 0) {
        currentCardIndex -= 1;
        remainingCards = totalCards - currentCardIndex;
        updateCardCounter();
        renderCard();
      } else {
        showAppNotification("Este é o primeiro cartão!");
      }
    } finally {
      setReviewContextChanging(false);
    }
  }

function classificationValueKey(value) {
  return normalizeFilterOptionLabel(value).toLocaleLowerCase("pt-BR");
}

function updateEditCardMatterOptions(card, selectedMatter = "") {
  const disciplineSelect = document.getElementById("edit-card-discipline");
  const matterSelect = document.getElementById("edit-card-matter");
  const selectedDiscipline = disciplineSelect.value;
  const availableMatters = addCardOptions.materias
    .filter(item => classificationValueKey(item.disciplina) === classificationValueKey(selectedDiscipline))
    .map(item => item.materia);

  const currentDiscipline = classificationValueKey(card.disciplina);
  const currentMatter = classificationValueKey(card.materia);
  const currentPairStillAvailable = addCardOptions.materias.some(item =>
    classificationValueKey(item.disciplina) === currentDiscipline &&
    classificationValueKey(item.materia) === currentMatter
  );
  if (classificationValueKey(selectedDiscipline) === currentDiscipline &&
      card.materia && !currentPairStillAvailable) {
    availableMatters.push(String(card.materia));
  }

  const uniqueMatters = sortedUniqueFilterValues(availableMatters);
  matterSelect.replaceChildren();
  const placeholder = document.createElement("option");
  placeholder.value = "";
  placeholder.textContent = selectedDiscipline ? "Selecione uma matéria" : "Selecione uma disciplina primeiro";
  matterSelect.appendChild(placeholder);
  matterSelect.disabled = !selectedDiscipline;

  uniqueMatters.forEach(matter => {
    const option = document.createElement("option");
    option.value = matter;
    option.textContent = normalizeFilterOptionLabel(matter);
    matterSelect.appendChild(option);
  });

  const selectedKey = classificationValueKey(selectedMatter);
  const selectedOption = Array.from(matterSelect.options).find(option =>
    selectedKey && classificationValueKey(option.value) === selectedKey
  );
  matterSelect.value = selectedOption ? selectedOption.value : "";
}

function populateEditCardMetadata(card) {
  const editor = document.getElementById("card-metadata-editor");
  const disciplineSelect = document.getElementById("edit-card-discipline");
  const currentDiscipline = String(card.disciplina == null ? "" : card.disciplina).trim();
  const currentMatter = String(card.materia == null ? "" : card.materia).trim();
  const disciplines = sortedUniqueFilterValues(addCardOptions.disciplinas);

  if (currentDiscipline && !disciplines.some(value =>
    classificationValueKey(value) === classificationValueKey(currentDiscipline)
  )) {
    disciplines.push(currentDiscipline);
    disciplines.sort((first, second) => filterCollator.compare(
      normalizeFilterOptionLabel(first), normalizeFilterOptionLabel(second)
    ));
  }

  disciplineSelect.replaceChildren();
  const placeholder = document.createElement("option");
  placeholder.value = "";
  placeholder.textContent = "Selecione uma disciplina";
  disciplineSelect.appendChild(placeholder);
  disciplines.forEach(discipline => {
    const option = document.createElement("option");
    option.value = discipline;
    option.textContent = normalizeFilterOptionLabel(discipline);
    disciplineSelect.appendChild(option);
  });

  const matchingDiscipline = Array.from(disciplineSelect.options).find(option =>
    currentDiscipline && classificationValueKey(option.value) === classificationValueKey(currentDiscipline)
  );
  disciplineSelect.value = matchingDiscipline ? matchingDiscipline.value : "";
  updateEditCardMatterOptions(card, currentMatter);
  document.getElementById("edit-card-content").value = String(card.conteudo == null ? "" : card.conteudo);
  disciplineSelect.onchange = () => updateEditCardMatterOptions(card);
  editor.hidden = false;
}

function isEditableCardPairAllowed(card, discipline, matter) {
  const disciplineKey = classificationValueKey(discipline);
  const matterKey = classificationValueKey(matter);
  const isCatalogPair = addCardOptions.materias.some(item =>
    classificationValueKey(item.disciplina) === disciplineKey &&
    classificationValueKey(item.materia) === matterKey
  );
  const isUnchangedCurrentPair =
    disciplineKey === classificationValueKey(card.disciplina) &&
    matterKey === classificationValueKey(card.materia);
  return isCatalogPair || isUnchangedCurrentPair;
}

    textarea.style.height = `${Math.max(textarea.scrollHeight + borderHeight, minHeight)}px`;
